<!doctype html><meta charset="utf-8"><title>PNT UI audio check</title><style>body{font:16px system-ui;padding:30px}pre{white-space:pre-wrap}</style><h1>Original the menu foundation UI sound check</h1><button id="run">Render UI and result sounds</button><pre id="results">Ready.</pre><script type="module">
import {AudioEngine} from '../src/menu-audio/audio/audio.js';
document.querySelector('#run').onclick=async()=>{const output=document.querySelector('#results');output.textContent='Rendering…';const rows=[];try{for(const name of ['ui_hover','ui_click','ui_confirm','ui_back','ui_toggle','ui_slider','ui_error','judge_reveal','victory_fanfare','defeat_jingle','xp_tick']){const ctx=new OfflineAudioContext(2,240000,48000),engine=new AudioEngine({context:ctx,music:false,seed:17});engine.init();engine.play(name);const buffer=await ctx.startRendering();let peak=0,energy=0,invalid=0;for(let c=0;c<2;c++)for(const value of buffer.getChannelData(c)){if(!Number.isFinite(value))invalid++;peak=Math.max(peak,Math.abs(value));energy+=value*value;}const pass=peak>0&&peak<1&&energy>0&&invalid===0;rows.push(`${pass?'PASS':'FAIL'} ${name}: peak ${peak.toFixed(4)}, energy ${energy.toFixed(3)}, invalid ${invalid}`);}output.textContent=rows.join('\n');}catch(e){output.textContent=rows.join('\n')+'\nERROR '+e.stack;}};
</script>
